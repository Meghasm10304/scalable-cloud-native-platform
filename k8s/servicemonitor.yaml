apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cine-sangeet
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: cine-sangeet
  namespaceSelector:
    matchNames:
      - cine-sangeet
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s